name: Build Mini Market APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cek file wajib
        run: |
          test -f Mart2.html || (echo "Mart2.html tidak ada" && exit 1)
          test -f google-services.json || (echo "google-services.json tidak ada" && exit 1)
          test -f debug.keystore || (echo "debug.keystore tidak ada" && exit 1)
      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www && cp Mart2.html www/index.html
          sed -i 's/signInWithGoogle()/signInWithGoogle({useCredentialManager:false})/' www/index.html
          cat > package.json <<'JSON'
          {"name":"mini-market","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0","@capacitor/cli":"^7.0.0","@capacitor-firebase/authentication":"^7.0.0","firebase":"^11.0.0"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.bakha.minimarket","appName":"Mini Market","webDir":"www","plugins":{"FirebaseAuthentication":{"skipNativeAuth":true,"providers":["google.com"]}}}
          JSON
          npm install
          npx cap add android
          cp google-services.json android/app/google-services.json
          keytool -importkeystore -srckeystore debug.keystore -srcstoretype PKCS12 -srcstorepass android -destkeystore android/app/debug.jks -deststoretype JKS -deststorepass android -destkeypass android -srcalias androiddebugkey -destalias androiddebugkey -noprompt
          keytool -list -v -keystore android/app/debug.jks -storepass android | grep -E "Keystore type|SHA1"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('debug.jks')
                      storeType 'jks'
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Cek tanda tangan APK
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -E "Owner|SHA1" || true
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMarket-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
